name: Claude Code Review

on:
  pull_request:
    branches: [dev, main]
    types: [opened, ready_for_review, reopened]

# Never run two reviews of the same PR at once
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Deny everything by default; each job opts in to what it needs
permissions: {}

jobs:
  review:
    # Skip draft PRs, and skip PRs from forks. GitHub withholds secrets from
    # fork PRs on public repos, so those runs would only fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # needed for the Claude GitHub App authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude code review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Only lets Claude post inline review comments; don't widen this
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
